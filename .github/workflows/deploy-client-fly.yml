# Deploy Alfred web client to Fly.io (app arkham-im).
# Builds the Docker image on GitHub Actions (Flutter build is too heavy for Fly Depot).
# Requires repository secret FLY_API_TOKEN (fly.io → Account → Access Tokens).

name: Deploy client Fly

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-client-fly.yml'
      - 'client/deploy/fly/**'
  workflow_dispatch:

concurrency:
  group: deploy-client-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build image on GitHub and deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::Missing repository secret FLY_API_TOKEN"
            exit 1
          fi
          APP="arkham-im"
          IMAGE="registry.fly.io/${APP}:${GITHUB_SHA}"
          flyctl auth docker
          docker build -f client/deploy/fly/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          flyctl deploy \
            --image "$IMAGE" \
            --config client/deploy/fly/fly.toml \
            --app "$APP"
