name: Deploy client

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-client.yml'
      - 'client/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-client.yml'
      - 'client/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev-demo
  cancel-in-progress: true

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get
        working-directory: client

      - name: Write deploy config (config.json + manifest.json)
        env:
          DEPLOY_SUPABASE_URL: ${{ secrets.DEPLOY_SUPABASE_URL }}
          DEPLOY_SUPABASE_ANON_KEY: ${{ secrets.DEPLOY_SUPABASE_ANON_KEY }}
          DEPLOY_PUBLIC_BASE_URL: ${{ secrets.DEPLOY_PUBLIC_BASE_URL }}
          DEPLOY_INSTANCE_NAME: ${{ secrets.DEPLOY_INSTANCE_NAME }}
        run: |
          if [[ -z "$DEPLOY_SUPABASE_URL" || -z "$DEPLOY_SUPABASE_ANON_KEY" ]]; then
            echo "DEPLOY_SUPABASE_URL e DEPLOY_SUPABASE_ANON_KEY devono essere configurati nei secrets del repository." >&2
            exit 1
          fi
          export public_base="${DEPLOY_PUBLIC_BASE_URL:-https://alfred-im.github.io/alfred-im/}"
          export instance_name="${DEPLOY_INSTANCE_NAME:-Messaging}"
          python3 - <<'PY'
          import json, os
          public_base = os.environ["public_base"]
          if not public_base.endswith("/"):
              public_base += "/"
          config = {
              "supabaseUrl": os.environ["DEPLOY_SUPABASE_URL"],
              "supabaseAnonKey": os.environ["DEPLOY_SUPABASE_ANON_KEY"],
              "publicBaseUrl": public_base,
          }
          with open("client/web/config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          manifest = {
              "name": os.environ["instance_name"],
              "short_name": os.environ["instance_name"],
              "start_url": ".",
              "display": "standalone",
              "background_color": "#2D2926",
              "theme_color": "#2D2926",
              "description": "Messaggistica consent-first",
              "orientation": "any",
              "prefer_related_applications": False,
              "icons": [
                  {"src": "icons/Icon-192.png", "sizes": "192x192", "type": "image/png"},
                  {"src": "icons/Icon-512.png", "sizes": "512x512", "type": "image/png"},
                  {
                      "src": "icons/Icon-maskable-192.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "maskable",
                  },
                  {
                      "src": "icons/Icon-maskable-512.png",
                      "sizes": "512x512",
                      "type": "image/png",
                      "purpose": "maskable",
                  },
              ],
          }
          with open("client/web/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=4)
              f.write("\n")
          PY

      - name: Build Flutter web (GitHub Pages base path)
        run: flutter build web --release --base-href "/alfred-im/" --no-pub --no-wasm-dry-run
        working-directory: client

      - name: Strip bundled CanvasKit (runtime loads from CDN)
        run: rm -rf client/build/web/canvaskit

      - name: SPA fallback for GitHub Pages
        run: cp client/build/web/index.html client/build/web/404.html

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/build/web

  # Gate (verify.sh) in release-suite.yml — non duplicato qui per preview Pages più rapida.
  # Ogni build (PR o main) pubblica su https://alfred-im.github.io/alfred-im/
  # Richiede ambiente github-pages con «Deployment branches: All branches»
  # (Settings → Environments → github-pages). Default repo: solo main → PR falliscono.
  deploy-client:
    runs-on: ubuntu-latest
    needs: build-client
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - name: Deploy client to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy client (retry 1)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy client (retry 2)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        id: deployment_retry2
        uses: actions/deploy-pages@v4

      - name: Fail if Pages deployment failed
        if: >-
          steps.deployment.outcome == 'failure'
          && steps.deployment_retry1.outcome == 'failure'
          && steps.deployment_retry2.outcome == 'failure'
        run: |
          echo "GitHub Pages deployment failed after 3 attempts."
          exit 1
