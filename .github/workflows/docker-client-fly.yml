name: Docker client Fly smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docker-client-fly.yml'
      - '.dockerignore'
      - 'client/deploy/fly/**'
      - 'client/deploy/blackgate/**'
      - 'client/**'
      - 'scripts/docker-smoke-client.sh'
      - 'scripts/fly-deploy-client.sh'
      - 'scripts/fly-deploy-blackgate.sh'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/docker-client-fly.yml'
      - '.dockerignore'
      - 'client/deploy/fly/**'
      - 'client/deploy/blackgate/**'
      - 'client/**'
      - 'scripts/docker-smoke-client.sh'
      - 'scripts/fly-deploy-client.sh'
      - 'scripts/fly-deploy-blackgate.sh'
  workflow_dispatch:

jobs:
  docker-smoke-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image and verify client gateway
        run: bash scripts/docker-smoke-client.sh
