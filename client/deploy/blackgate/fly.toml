# fly.toml app configuration file generated for blackgate-im on 2026-09-07T22:28:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blackgate-im'
primary_region = 'ams'

[build]
  dockerfile = '../fly/Dockerfile'

  [build.args]
    INSTANCE_CONFIG_JSON = 'client/deploy/blackgate/config.json'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
