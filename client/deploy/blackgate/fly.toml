# Blackgate web client (PWA) — second demo instance (separate Supabase + Fly app).
# Deploy from repo root (build context = .):
#   bash scripts/fly-deploy-blackgate.sh
# Fly Launch / GitHub: config path = client/deploy/blackgate/fly.toml, working directory = . (root)

app = "blackgate-im"
primary_region = "fra"

[build]
  dockerfile = "../shared/Dockerfile"

  [build.args]
    INSTANCE_CONFIG_JSON = "client/deploy/blackgate/config.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
