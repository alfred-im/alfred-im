# Alfred web client (PWA) — separate Fly app from bridge workers (root fly.toml).
# Deploy from repo root (build context = .):
#   fly deploy . --config client/deploy/fly/fly.toml
# Fly Launch / GitHub: config path = client/deploy/fly/fly.toml, working directory = . (root)
#   — NON client/deploy/fly (duplica il path del Dockerfile).

app = "alfred-im-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
