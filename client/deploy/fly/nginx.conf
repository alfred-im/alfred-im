# Alfred client gateway — static Flutter web (SPA) on Fly (internal_port 8080).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deploy wiring + PWA shell — not immutable across rebuilds.
    location ~* ^/(config\.json|manifest\.json|flutter_service_worker\.js|push_sw\.js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
